name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dist_tag: ${{ steps.v.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A manual run validated the ref it was given and then tested and
          # published whatever the workflow happened to check out, which need
          # not be that tag. Check out the ref being released.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # The git tag is the single source of truth for the release version.
      # Abort before anything is published if it is malformed or package.json
      # has drifted from it.
      - id: v
        name: Validate version and resolve dist-tag
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          VERSION="$(bash .github/scripts/validate-release-version.sh "$REF")"
          DIST_TAG="$(bash .github/scripts/npm-dist-tag.sh "$REF")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION under dist-tag $DIST_TAG"

  test:
    name: test before publish
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A manual run validated the ref it was given and then tested and
          # published whatever the workflow happened to check out, which need
          # not be that tag. Check out the ref being released.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Native modules load
        run: node -e "import('./lib/db.js').then(() => console.log('ok'))"

  publish:
    name: npm publish
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A manual run validated the ref it was given and then tested and
          # published whatever the workflow happened to check out, which need
          # not be that tag. Check out the ref being released.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # npm answers a failed publish with 404 on PUT, which reads as "package
      # not found" but means "not authenticated, or not allowed to publish into
      # this scope". Ask the token who it is first, so the log names the account
      # instead of leaving the scope/permission question open.
      - name: Identify the token
        run: |
          # Shape only - length and prefix class. GitHub masks the value itself,
          # and a token pasted with a trailing newline or truncated mid-copy is
          # indistinguishable from a revoked one until you look at its length.
          LEN=${#NODE_AUTH_TOKEN}
          case "$NODE_AUTH_TOKEN" in
            npm_*)  SHAPE="npm_ (automation or granular)" ;;
            "")     SHAPE="EMPTY - the secret did not reach this step" ;;
            *)      SHAPE="legacy/unknown prefix" ;;
          esac
          echo "token length: $LEN"
          echo "token shape:  $SHAPE"
          printf '%s' "$NODE_AUTH_TOKEN" | grep -q '[[:space:]]' && echo "WARNING: token contains whitespace - it was pasted with a newline or space"
          echo "authenticated as: $(npm whoami || echo '<rejected>')"
          echo "publishing as:    $(node -p "require('./package.json').name")"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        # No --provenance: npm/sigstore provenance requires a PUBLIC source
        # repository, and this one is private (it returns 422 "Unsupported
        # GitHub Actions source repository visibility: private"). Consumers
        # therefore cannot rely on `npm audit signatures` for these packages.
        # Add --provenance the day the repository goes public.
        #
        # --access public is required: a scoped package defaults to restricted,
        # and a restricted publish on a free account fails outright.
        run: npm publish --access public --tag "${{ needs.validate.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### Published @ndokutovich/arca@${{ needs.validate.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "dist-tag: \`${{ needs.validate.outputs.dist_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
