name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The native modules (better-sqlite3, sqlite-vec) are the fragile part,
        # so build them everywhere rather than trusting one platform.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Native modules load
        run: node -e "import('./lib/db.js').then(() => console.log('ok'))"

  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Two high-severity advisories sit in @huggingface/transformers' tree and
      # are only cleared by its 4.x major. That bump changes the embedding
      # library that produced every vector already in a user's database, so it
      # is a deliberate migration, not a patch. Fail on critical only until then.
      - name: Audit (critical)
        run: npm audit --audit-level=critical
