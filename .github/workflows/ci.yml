name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The native modules (better-sqlite3, sqlite-vec) are the fragile part,
        # so build them everywhere rather than trusting one platform.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 20 went end-of-life 2026-04-30; better-sqlite3 13 requires 22+.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 13 ships prebuilt binaries and sets gypfile:false so npm
      # skips node-gyp. The npm bundled with Node 22 predates that handling and
      # compiles anyway, which needs a toolchain the Windows runner does not
      # have (node-gyp 11.5 does not recognise Visual Studio 18). Install the
      # npm that honours it, which is also what the prebuilt path needs.
      - name: Use npm that honours gypfile
        run: npm i -g npm@^11
      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Native modules load
        run: node -e "import('./lib/db.js').then(() => console.log('ok'))"

  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # The tree is clean, so the gate is strict. The advisories that once forced
      # leniency here lived under @huggingface/transformers 3.x and went with the
      # 4.x upgrade — which, measured against the previous version, produces
      # bit-identical vectors, so nothing had to be re-indexed for it.
      - name: Audit
        run: npm audit --audit-level=high
